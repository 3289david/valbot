# Nginx site for the Valorant Hub website.
# Replace YOUR_DOMAIN with your real domain (e.g. valbot.example.com) in both places.
# Install: sudo cp deploy/nginx-valorant-hub.conf /etc/nginx/sites-available/valorant-hub
#          sudo ln -s /etc/nginx/sites-available/valorant-hub /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run Certbot (see README) to add HTTPS; it edits this file for you.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 1m;

    # Static assets: let browsers cache them
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
